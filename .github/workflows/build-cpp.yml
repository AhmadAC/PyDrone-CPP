name: Build C++ Firmware

on:
  push:
    branches: [ pydrone, master, main ]
  pull_request:
    branches: [ pydrone, master, main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Firmware and Merge Binaries
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          # Build directly from the repository root since CMakeLists.txt is located here
          command: |
            idf.py build && \
            cd build && \
            esptool.py --chip esp32s3 merge_bin -o merged-pydrone-s3.bin --fill-flash-size 4MB @flash_args

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyDrone
          path: build/merged-pydrone-s3.bin